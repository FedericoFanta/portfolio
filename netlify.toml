[build]
  command = "npm run build"
  publish = "out"

# URL pública del sitio. Se incrusta en el build (canonical, hreflang, sitemap,
# Open Graph y JSON-LD). Cuando haya dominio propio, cambiar solo esta línea.
[build.environment]
  NEXT_PUBLIC_SITE_URL = "https://federicofantacone.netlify.app"
  NODE_VERSION = "22"
