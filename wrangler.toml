# Configuración para Cloudflare Pages (deploy estático).
# El build se ejecuta con `npm run build` y publica la carpeta `out/`.
name = "portfolio-zgw"
pages_build_output_dir = "out"
compatibility_date = "2026-01-01"

# Variables de entorno del build (NEXT_PUBLIC_SITE_URL, etc.) se configuran
# en el dashboard de Cloudflare Pages: Settings → Environment variables.
# Localmente se pueden definir en .env.local.